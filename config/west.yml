manifest:
  remotes:
    - name: splitkb
      url-base: https://github.com/splitkb
    # Fork of zmk-halcyon-module, carrying the custom vibetv epaper image.
    # Rebase it onto splitkb/main when they move; see CLAUDE.md.
    - name: vineus
      url-base: https://github.com/vineus
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: splitkb
      revision: main+halcyon-fixes
      import: app/west.yml
    - name: zmk-halcyon-module
      remote: vineus
      revision: feat/vibetv-epaper-image
  self:
    path: config
