# Needed for the &inc_dec_msc scroll bindings on the Lower/Raise encoders.
CONFIG_ZMK_POINTING=y

# --- RGB underglow -----------------------------------------------------------
# Whole-strip only: ZMK has no per-key RGB matrix, so the QMK per-key layer
# colours and Hyper hints cannot come back. Gold at boot approximates the old
# keyboard_post_init_user() startup.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=45
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50

# EXPERIMENT: the coincell shield ships DISABLE_WHEN_USB_DISCONNECTED for both
# underglow and ext power, but both `depends on USB_DEVICE_STACK`, and ZMK_USB
# is central-only -- so on our two peripheral halves they are silently inert.
# Force the stack in and see whether the auto-off options become selectable.
CONFIG_USB_DEVICE_STACK=y
CONFIG_ZMK_RGB_UNDERGLOW_DISABLE_WHEN_USB_DISCONNECTED=y
CONFIG_ZMK_EXT_POWER_DISABLE_WHEN_USB_DISCONNECTED=y
